<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 14px 16px; width: 250px; color: #111; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
    p { color: #666; font-size: 12px; margin: 10px 0 0; }
    @media (prefers-color-scheme: dark) { body { background: #1e1e1e; color: #eee; } p { color: #aaa; } }
  </style>
</head>
<body>
  <h1>Instagram Friends Only</h1>
  <label><input type="checkbox" id="followingFeed"> Always open the Following feed</label>
  <label><input type="checkbox" id="hideReels"> Hide Reels tab</label>
  <label><input type="checkbox" id="hideExplore"> Hide Explore</label>
  <label><input type="checkbox" id="hideSuggested"> Hide suggested posts &amp; accounts</label>
  <label><input type="checkbox" id="hideAds"> Hide sponsored posts</label>
  <p>Changes apply right away in open Instagram tabs.</p>
  <script src="popup.js"></script>
</body>
</html>
